<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學術單字測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --card: #1e1e1e; --border: #2e2e2e;
    --accent: #e8ff47; --accent2: #47c8ff; --accent3: #ff6b6b;
    --text: #f0f0f0; --muted: #888; --correct: #4fffb0; --wrong: #ff4f4f; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 60px; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(232,255,71,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(71,200,255,0.05) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .container { width: 100%; max-width: 700px; position: relative; z-index: 1; }

  /* HEADER */
  header { text-align: center; margin-bottom: 32px; }
  header .label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  header h1 { font-size: clamp(26px, 6vw, 42px); font-weight: 900; line-height: 1.1; background: linear-gradient(135deg, #f0f0f0 30%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* SELECT SCREEN */
  #select-section { animation: slideIn 0.4s ease; }
  .select-title { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 20px; text-align: center; }
  .sublist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .sublist-btn {
    background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 16px 12px; cursor: pointer; text-align: center; transition: all 0.18s; color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
  }
  .sublist-btn:hover { border-color: var(--accent); background: rgba(232,255,71,0.04); transform: translateY(-2px); }
  .sublist-btn.selected { border-color: var(--accent); background: rgba(232,255,71,0.08); }
  .sublist-btn .sl-num { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); }
  .sublist-btn .sl-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .sublist-btn.selected .sl-count { color: var(--accent); }

  .select-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; justify-content: center; }
  .sel-all-btn, .sel-none-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 99px;
    padding: 6px 18px; color: var(--muted); font-size: 12px; cursor: pointer;
    font-family: 'Space Mono', monospace; transition: all 0.15s;
  }
  .sel-all-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sel-none-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  .q-count-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .q-count-wrap label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 10px; }
  .q-count-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .q-count-btn {
    background: var(--card); border: 2px solid var(--border); border-radius: 8px;
    padding: 8px 18px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 13px;
    color: var(--text); transition: all 0.15s;
  }
  .q-count-btn:hover { border-color: var(--accent2); }
  .q-count-btn.selected { border-color: var(--accent2); background: rgba(71,200,255,0.08); color: var(--accent2); }

  .start-btn {
    width: 100%; background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius);
    padding: 18px; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,255,71,0.25); }
  .start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* QUIZ SECTION */
  .progress-wrap { background: var(--border); border-radius: 99px; height: 6px; margin-bottom: 10px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .progress-info { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 20px; }

  .score-strip { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
  .score-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 5px 16px; font-family: 'Space Mono', monospace; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .score-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-correct { background: var(--correct); } .dot-wrong { background: var(--wrong); }
  .score-pill.mode-pill { color: var(--accent2); border-color: rgba(71,200,255,0.3); }

  .question-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 28px 24px; margin-bottom: 16px; position: relative; overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .question-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .q-number { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 14px; }
  .q-word { font-family: 'Space Mono', monospace; font-size: clamp(30px, 7vw, 52px); font-weight: 700; color: var(--accent); letter-spacing: -1px; line-height: 1; margin-bottom: 8px; }
  .q-hint { font-size: 12px; color: var(--muted); font-style: italic; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .option-btn {
    background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 16px 14px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 14px;
    cursor: pointer; text-align: left; transition: border-color 0.18s, background 0.18s, transform 0.12s;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(232,255,71,0.04); transform: translateY(-2px); }
  .option-label { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); flex-shrink: 0; margin-top: 1px; transition: color 0.18s; }
  .option-btn:hover:not(:disabled) .option-label { color: var(--accent); }
  .option-btn.correct { border-color: var(--correct); background: rgba(79,255,176,0.07); animation: pulse-correct 0.4s ease; }
  .option-btn.correct .option-label { color: var(--correct); }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(255,79,79,0.07); animation: shake 0.4s ease; }
  .option-btn.wrong .option-label { color: var(--wrong); }
  .option-btn:disabled { cursor: default; }

  .feedback { min-height: 36px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; transition: opacity 0.3s; opacity: 0; }
  .feedback.show { opacity: 1; }
  .feedback.correct-fb { background: rgba(79,255,176,0.1); color: var(--correct); border: 1px solid rgba(79,255,176,0.2); }
  .feedback.wrong-fb { background: rgba(255,79,79,0.1); color: var(--wrong); border: 1px solid rgba(255,79,79,0.2); }

  .next-btn { width: 100%; background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 15px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; display: none; }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,255,71,0.25); }
  .next-btn.visible { display: block; animation: fadeUp 0.3s ease; }

  /* RESULTS */
  .results { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 44px 28px; text-align: center; animation: slideIn 0.5s cubic-bezier(0.4,0,0.2,1); display: none; }
  .results.show { display: block; }
  .results-emoji { font-size: 60px; margin-bottom: 14px; }
  .results-title { font-size: 26px; font-weight: 900; margin-bottom: 6px; background: linear-gradient(135deg, #f0f0f0 30%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .results-score { font-family: 'Space Mono', monospace; font-size: 48px; font-weight: 700; color: var(--accent); margin: 14px 0; line-height: 1; }
  .results-sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .results-stats { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; min-width: 90px; }
  .stat-num { font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700; }
  .stat-num.green { color: var(--correct); } .stat-num.red { color: var(--wrong); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 14px 32px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,255,71,0.25); }
  .review-btn, .back-to-select-btn { background: transparent; color: var(--text); border: 2px solid var(--border); border-radius: var(--radius); padding: 12px 24px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .review-btn:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .back-to-select-btn:hover { border-color: var(--muted); transform: translateY(-2px); }

  /* REVIEW */
  .review { display: none; }
  .review.show { display: block; }
  .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { background: transparent; color: var(--text); border: 2px solid var(--border); border-radius: var(--radius); padding: 10px 20px; font-family: 'Space Mono', monospace; font-size: 12px; cursor: pointer; transition: border-color 0.15s; }
  .back-btn:hover { border-color: var(--accent2); }
  .review-title { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .review-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; }
  .review-item.r-correct { border-left: 3px solid var(--correct); }
  .review-item.r-wrong { border-left: 3px solid var(--wrong); }
  .review-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .review-word { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent); }
  .review-sl { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .review-answer { font-size: 13px; color: var(--text); margin-top: 3px; }
  .review-your { font-size: 12px; margin-top: 2px; color: var(--wrong); }

  @keyframes slideIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-correct { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    .question-card { padding: 22px 16px 18px; }
    .sublist-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  }

/* AWL_EXERCISE_STYLE_START */
.mode-switch { display: flex; gap: 8px; justify-content: center; margin: -12px 0 24px; flex-wrap: wrap; }
.mode-tab { background: var(--surface); border: 2px solid var(--border); color: var(--muted); border-radius: 99px; padding: 10px 18px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all .16s; }
.mode-tab:hover { border-color: var(--accent2); color: var(--accent2); transform: translateY(-1px); }
.mode-tab.active { border-color: var(--accent); color: #0d0d0d; background: var(--accent); }
.exercise-select { display: none; animation: slideIn .4s ease; }
.exercise-select.show { display: block; }
.exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.exercise-filter-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }
.exercise-filter-row label { display: block; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.exercise-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.exercise-chip { background: var(--card); border: 2px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 12px; transition: all .15s; }
.exercise-chip:hover { border-color: var(--accent2); }
.exercise-chip.active { border-color: var(--accent2); background: rgba(71,200,255,.08); color: var(--accent2); }
.exercise-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.exercise-start-btn, .exercise-secondary-btn { border: none; border-radius: var(--radius); padding: 15px 14px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.exercise-start-btn { background: var(--accent); color: #0d0d0d; }
.exercise-secondary-btn { background: transparent; color: var(--text); border: 2px solid var(--border); }
.exercise-start-btn:hover, .exercise-secondary-btn:hover { transform: translateY(-2px); }
.exercise-secondary-btn:hover { border-color: var(--accent2); }
.exercise-select .q-count-wrap { margin-bottom: 14px; }
.exercise-select .start-btn { margin-top: 4px; }
.exercise-retry-btn { width: 100%; margin-top: 10px; }
#exercise-section { display: none; }
.exercise-question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 22px; margin-bottom: 16px; position: relative; overflow: hidden; animation: slideIn .35s cubic-bezier(.4,0,.2,1); }
.exercise-question-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.exercise-source { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 13px; }
.exercise-focus-word { font-family: 'Space Mono', monospace; font-size: clamp(26px, 6vw, 46px); font-weight: 700; color: var(--accent); line-height: 1.05; margin-bottom: 7px; overflow-wrap: anywhere; }
.exercise-answer-zh { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.exercise-sentence { font-size: clamp(18px, 4.5vw, 28px); line-height: 1.42; font-weight: 700; color: var(--text); margin-bottom: 14px; }
.exercise-translation { background: rgba(71,200,255,.07); border: 1px solid rgba(71,200,255,.18); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.exercise-translation-label { color: var(--accent2); font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 6px; text-transform: uppercase; }
.exercise-translation-text { color: var(--text); font-size: 13px; line-height: 1.45; }
.exercise-translation-en { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.35; margin-top: 6px; overflow-wrap: anywhere; }
.exercise-blank { display: inline-block; min-width: 120px; border-bottom: 3px solid var(--accent); transform: translateY(-4px); }

.exercise-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.exercise-option { min-height: 42px; background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 13px; line-height: 1.2; text-align: left; cursor: pointer; display: flex; gap: 7px; align-items: center; transition: all .16s; }
.exercise-option:hover:not(:disabled) { border-color: var(--accent); background: rgba(232,255,71,.04); transform: translateY(-1px); }
.exercise-option .key { font-family: 'Space Mono', monospace; color: var(--muted); font-size: 11px; flex-shrink: 0; min-width: 18px; }
.exercise-option.correct { border-color: var(--correct); background: rgba(79,255,176,.08); }
.exercise-option.wrong { border-color: var(--wrong); background: rgba(255,79,79,.08); }
.exercise-feedback { min-height: 38px; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; }
.exercise-feedback.show { opacity: 1; }
.exercise-feedback.ok { color: var(--correct); background: rgba(79,255,176,.1); border: 1px solid rgba(79,255,176,.2); }
.exercise-feedback.bad { color: var(--wrong); background: rgba(255,79,79,.1); border: 1px solid rgba(255,79,79,.2); }
.exercise-live-review { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin: 0 0 14px; }
.exercise-live-review summary { cursor: pointer; color: var(--accent2); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.exercise-live-list { margin-top: 10px; display: grid; gap: 8px; }
.exercise-live-empty { color: var(--muted); font-size: 12px; }
.exercise-live-item { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--wrong); border-radius: 9px; padding: 10px 12px; }
.exercise-live-meta { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; margin-bottom: 4px; }
.exercise-live-prompt { color: var(--text); font-size: 12px; line-height: 1.35; margin-bottom: 4px; }
.exercise-live-answer { color: var(--correct); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; }
.exercise-live-zh { color: var(--accent2); font-size: 12px; margin-top: 3px; }
.exercise-live-translation { color: var(--text); font-size: 12px; line-height: 1.4; margin-top: 4px; }
.exercise-footer { display: flex; gap: 10px; flex-wrap: wrap; }
.exercise-footer button { flex: 1; min-width: 140px; }
@media (max-width: 480px) { .exercise-actions { grid-template-columns: 1fr; } .exercise-options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* AWL_EXERCISE_STYLE_END */

/* RESPONSIVE_LAYOUT_V2_START */
.container { max-width: min(100%, 760px); }
.option-btn, .exercise-option, .sublist-btn, .exercise-chip, .q-count-btn, .mode-tab, button { touch-action: manipulation; }
.q-word, .exercise-sentence, .option-btn span:last-child, .exercise-option span:last-child { overflow-wrap: anywhere; }

@media (min-width: 900px) {
  body { padding: 30px 24px 72px; }
  .container { max-width: 960px; }
  header { margin-bottom: 28px; }
  .sublist-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .q-count-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .q-count-btn { width: 100%; }
  .question-card, .exercise-question-card { padding: 34px 34px 26px; }
  .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .exercise-options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .option-btn { min-height: 64px; align-items: center; }
  .exercise-option { min-height: 42px; padding: 8px 10px; align-items: center; }
  .exercise-filter-grid { grid-template-columns: 1fr 1fr; align-items: start; }
  .exercise-actions { max-width: 620px; margin: 0 auto; }
}

@media (max-width: 720px) {
  body { padding: 10px 8px 28px; }
  body::before, body::after { width: 300px; height: 300px; }
  .container { max-width: 100%; }
  header { margin-bottom: 10px; }
  header .label { font-size: 9px; letter-spacing: 2px; margin-bottom: 4px; }
  header h1 { font-size: 22px; line-height: 1.05; }
  .mode-switch { margin: 0 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode-tab { width: 100%; padding: 8px 6px; font-size: 10px; }
  .select-title { font-size: 10px; letter-spacing: 1.5px; margin-bottom: 8px; }
  .sublist-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
  .sublist-btn { min-height: 48px; padding: 7px 4px; border-radius: 8px; }
  .sublist-btn .sl-num { font-size: 13px; }
  .sublist-btn .sl-count { font-size: 9px; margin-top: 1px; }
  .select-actions { margin-bottom: 10px; gap: 6px; }
  .sel-all-btn, .sel-none-btn { padding: 5px 12px; font-size: 10px; }
  .q-count-wrap, .exercise-card { padding: 10px; margin-bottom: 10px; }

// ── STATE ────────────────────────────────────────────────────────
let selectedSublists = [];
let questionCount = 10;
let quizPool = [];
let current = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let history = [];
let lastSelectedSublists = [];
let lastQuestionCount = 10;

// ── INIT ─────────────────────────────────────────────────────────
function init() {
  const grid = document.getElementById('sublist-grid');
  grid.innerHTML = '';
  Object.keys(SUBLISTS).forEach(k => {
    const n = parseInt(k);
    const btn = document.createElement('button');
    btn.className = 'sublist-btn';
    btn.id = `sl-btn-${n}`;
    btn.onclick = () => toggleSublist(n);
    btn.innerHTML = `<div class="sl-num">SL ${n}</div><div class="sl-count">${SUBLISTS[n].length} 個單字</div>`;
    grid.appendChild(btn);
  });
  updateStartBtn();
}

function toggleSublist(n) {
  const idx = selectedSublists.indexOf(n);
  const btn = document.getElementById(`sl-btn-${n}`);
  if (idx === -1) { selectedSublists.push(n); btn.classList.add('selected'); }
  else { selectedSublists.splice(idx, 1); btn.classList.remove('selected'); }
  updateStartBtn();
}

function selectAll() {
  Object.keys(SUBLISTS).forEach(k => {
    const n = parseInt(k);
    if (!selectedSublists.includes(n)) { selectedSublists.push(n); document.getElementById(`sl-btn-${n}`).classList.add('selected'); }
  });
  updateStartBtn();
}

function selectNone() {
  selectedSublists = [];
  document.querySelectorAll('.sublist-btn').forEach(b => b.classList.remove('selected'));
  updateStartBtn();
}

function setQCount(btn, n) {
  questionCount = n;
  document.querySelectorAll('.q-count-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function updateStartBtn() {
  const btn = document.getElementById('start-btn');
  const total = selectedSublists.reduce((s, n) => s + SUBLISTS[n].length, 0);
  if (selectedSublists.length === 0) {
    btn.disabled = true; btn.textContent = '選擇 Sublist 後開始測驗';
  } else {
    btn.disabled = false;
    const sl = selectedSublists.sort((a,b)=>a-b).map(n=>`SL${n}`).join('+');
    btn.textContent = `開始測驗 (${sl}，共 ${total} 個單字)`;
  }
}

// ── QUIZ ─────────────────────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz() {
  lastSelectedSublists = [...selectedSublists];
  lastQuestionCount = questionCount;
  let pool = [];
  selectedSublists.forEach(n => pool.push(...SUBLISTS[n].map(item => ({...item, sl: n}))));
  pool = shuffle(pool);
  const total = questionCount === 999 ? pool.length : Math.min(questionCount, pool.length);
  quizPool = pool.slice(0, total);
  current = 0; correctCount = 0; wrongCount = 0; history = [];

  document.getElementById('select-section').style.display = 'none';
  document.getElementById('results-section').classList.remove('show');
  document.getElementById('review-section').classList.remove('show');
  document.getElementById('quiz-section').style.display = 'block';

  const slLabel = lastSelectedSublists.sort((a,b)=>a-b).map(n=>`SL${n}`).join('+');
  document.getElementById('mode-pill').textContent = slLabel;
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-wrong').textContent = '0';
  loadQuestion();
}

function getAllZh() {
  let all = [];
  Object.values(SUBLISTS).forEach(sl => sl.forEach(item => all.push(item.zh)));
  return [...new Set(all)];
}

function buildOptions(item) {
  const allZh = getAllZh().filter(z => z !== item.zh);
  const wrong = shuffle(allZh).slice(0, 3);
  return shuffle([item.zh, ...wrong]);
}

function loadQuestion() {
  answered = false;
  const item = quizPool[current];
  const total = quizPool.length;
  const pct = (current / total) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `題目 ${current + 1} / ${total}`;
  document.getElementById('q-remain').textContent = `剩餘 ${total - current} 題`;
  document.getElementById('q-number').textContent = `QUESTION ${String(current+1).padStart(2,'0')} · SL${item.sl}`;
  document.getElementById('q-word').textContent = item.w;
  document.getElementById('q-hint').textContent = `詞性：${item.pos}`;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  const nb = document.getElementById('next-btn');
  nb.classList.remove('visible');

  const opts = buildOptions(item);
  const container = document.getElementById('options');
  container.innerHTML = '';
  ['A','B','C','D'].forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${lbl}</span><span>${opts[i]}</span>`;
    btn.onclick = () => selectAnswer(btn, opts[i], item.zh, item);
    container.appendChild(btn);
  });

  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = ''; });
}

function selectAnswer(btn, chosen, correct, item) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  const isCorrect = chosen === correct;
  const fb = document.getElementById('feedback');

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    document.getElementById('score-correct').textContent = correctCount;
    fb.className = 'feedback correct-fb show';
    document.getElementById('feedback-icon').textContent = '✓';
    document.getElementById('feedback-text').textContent = `正確！${correct}`;
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    document.getElementById('score-wrong').textContent = wrongCount;
    fb.className = 'feedback wrong-fb show';
    document.getElementById('feedback-icon').textContent = '✗';
    document.getElementById('feedback-text').textContent = `答錯！正確答案是：${correct}`;
    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.querySelector('span:last-child').textContent === correct) b.classList.add('correct');
    });
  }
  history.push({ word: item.w, sl: item.sl, correct: isCorrect, answer: correct, chosen });
  const nb = document.getElementById('next-btn');
  nb.classList.add('visible');
  nb.textContent = current === quizPool.length - 1 ? '查看結果 →' : '下一題 →';
}

function nextQuestion() {
  current++;
  if (current >= quizPool.length) showResults();
  else loadQuestion();
}

// ── RESULTS ──────────────────────────────────────────────────────
function showResults() {
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('results-section').classList.add('show');
  const total = quizPool.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('results-score').textContent = `${correctCount}/${total}`;
  document.getElementById('results-sub').textContent = `答對率 ${pct}%`;
  document.getElementById('final-correct').textContent = correctCount;
  document.getElementById('final-wrong').textContent = wrongCount;
  let emoji, title;
  if (pct===100){emoji='🏆';title='完美！全對！';}
  else if (pct>=80){emoji='🎉';title='非常好！繼續加油！';}
  else if (pct>=60){emoji='👍';title='不錯！還有進步空間！';}
  else if (pct>=40){emoji='📚';title='繼續努力！多背幾次！';}
  else{emoji='💪';title='加把勁！重新挑戰！';}
  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-title').textContent = title;
}

function restartSame() {
  selectedSublists = [...lastSelectedSublists];
  questionCount = lastQuestionCount;
  startQuiz();
}

function backToSelect() {
  document.getElementById('results-section').classList.remove('show');
  document.getElementById('select-section').style.display = 'block';
}

function showReview() {
  document.getElementById('results-section').classList.remove('show');
  document.getElementById('review-section').classList.add('show');
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  history.forEach(h => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (h.correct ? 'r-correct' : 'r-wrong');
    div.innerHTML = `
      <span class="review-icon">${h.correct ? '✓' : '✗'}</span>
      <div>
        <div class="review-word">${h.word}</div>
        <div class="review-sl">Sublist ${h.sl}</div>
        <div class="review-answer">正確答案：${h.answer}</div>
        ${!h.correct ? `<div class="review-your">你的答案：${h.chosen}</div>` : ''}
      </div>`;
    list.appendChild(div);
  });
}

function backToResults() {
  document.getElementById('review-section').classList.remove('show');
  document.getElementById('results-section').classList.add('show');
}

","volume","demonstrated","removed","coordinates"],"answer":"maximize","id":"S3-E6b-Q6","number":6},{"prompt":"A rooftop solar water heater requires about three hours of sunshine per day to provide _______________ hot water for a family of four.","options":["maximize","consent","instance","physical","framework","sufficient","volume","demonstrated","removed","coordinates"],"answer":"sufficient","id":"S3-E6b-Q7","number":7},{"prompt":"A heart attack most often occurs in the morning when mental and _______________ stress are at their peak.","options":["maximize","consent","instance","physical","framework","sufficient","volume","demonstrated","removed","coordinates"],"answer":"physical","id":"S3-E6b-Q8","number":8},{"prompt":"There are many examples of social breakdown. One example is the increase in the _______________ of homeless people in the streets.","options":["maximize","consent","instance","physical","framework","sufficient","volume","demonstrated","removed","coordinates"],"answer":"instance","id":"S3-E6b-Q9","number":9},{"prompt":"The committee met today to discuss the _______________ for the city's bid for the 2040 Olympics.","options":["maximize","consent","instance","physical","framework","sufficient","volume","demonstrated","removed","coordinates"],"answer":"framework","id":"S3-E6b-Q10","number":10}]},{"name":"AWL Sublist 3 - Exercise 6c.html","sublist":3,"exercise":6,"part":"c","questions":[{"prompt":"The class decided by _______________ what the consequences would be for lateness and absenteeism.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"consensus","id":"S3-E6c-Q1","number":1},{"prompt":"The big bang which created the universe filled the entire _______________ of the universe from the first moment.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"volume","id":"S3-E6c-Q2","number":2},{"prompt":"I was always kind of _______________ as a kid, and hated playing sports because I did so badly.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"uncoordinated","id":"S3-E6c-Q3","number":3},{"prompt":"Your thesis has a number of very serious and _______________ errors that need to be addressed.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"demonstrable","id":"S3-E6c-Q4","number":4},{"prompt":"A constitution provides the essential _______________ for orderly government, and for relations between people and their government.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"framework","id":"S3-E6c-Q5","number":5},{"prompt":"Several _______________ of late deliveries resulted in a considerable loss of business for the store.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"instances","id":"S3-E6c-Q6","number":6},{"prompt":"The ability of modern science to describe the internal structure of the moon is based on a variety of _______________ observations.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"physical","id":"S3-E6c-Q7","number":7},{"prompt":"Forgetting material which is stored in long-term memory cannot be _______________ explained by the simple passage of time.","options":["framework","maximize","uncoordinated","instances","demonstrable","consensus","volume","physical","removable","sufficiently"],"answer":"sufficiently","id":"S3-E6c-Q8","number":8},{"prompt":"My son wants a pair of roller blades with _______________ wheels so they ca  American president on the crisis developing in the Middle East.","options":["status","hence","occupy","attributed","confer","internal","access","promote","domestic","phase"],"answer":"confer","id":"S4-E1a-Q6","number":6},{"prompt":"Doctors and lawyers are high _______________ jobs in our society.","options":["status","hence","occupy","attributed","confer","internal","access","promote","domestic","phase"],"answer":"status","id":"S4-E1a-Q7","number":7},{"prompt":"One of the goals of the United Nations is to _______________ respect for human rights and fundamental freedoms.","options":["status","hence","occupy","attributed","confer","internal","access","promote","domestic","phase"],"answer":"promote","id":"S4-E1a-Q8","number":8},{"prompt":"Most teenagers go through a _______________ in which they argue a lot with their parents.","options":["status","hence","occupy","attributed","confer","internal","access","promote","domestic","phase"],"answer":"phase","id":"S4-E1a-Q9","number":9},{"prompt":"The driver of the car suffered minor _______________ injuries from his seatbelt, but was otherwise okay.","options":["status","hence","occupy","attributed","confer","internal","access","promote","domestic","phase"],"answer":"internal","id":"S4-E1a-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 1b.html","sublist":4,"exercise":1,"part":"b","questions":[{"prompt":"The sculpture was originally thought to be a work of Michelangelo, but is now _______________ to a student of the master.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"attributed","id":"S4-E1b-Q1","number":1},{"prompt":"Electrical burns often look minor on the outside, but electricity can cause serious _______________ damage.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"internal","id":"S4-E1b-Q2","number":2},{"prompt":"The island nation of Malta has no _______________ energy sources.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"domestic","id":"S4-E1b-Q3","number":3},{"prompt":"Seventy percent of our Earth's surface is _______________ by oceans.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"occupied","id":"S4-E1b-Q4","number":4},{"prompt":"I'll need to _______________ with my supervisor before I can allow that.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"confer","id":"S4-E1b-Q5","number":5},{"prompt":"Wine will spoil if exposed to light; _______________, wine bottles are usually green or yellow.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"hence","id":"S4-E1b-Q6","number":6},{"prompt":"Desmond Morris once remarked that a true bond of friendship is usually only possible between people of roughly equal _______________.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"status","id":"S4-E1b-Q7","number":7},{"prompt":"More than one billion people on our planet lack _______________ to safe drinking water.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"access","id":"S4-E1b-Q8","number":8},{"prompt":"A complete cycle of the _______________ of the moon takes 29.53 days.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"phases","id":"S4-E1b-Q9","number":9},{"prompt":"My father was recently _______________ to the position of manager.","options":["occupied","promoted","domestic","access","attributed","confer","hence","phases","status","internal"],"answer":"promoted","id":"S4-E1b-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 1c.html","sublist":4,"exercise":1,"part":"c","questions":[{"prompt":"We are now entering the final _______________ of our 10-year commercial project.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"phase","id":"S4-E1c-Q1","number":1},{"prompt":"Thousands of deaths each year are _______________ to drunk drivers.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"attributable","id":"S4-E1c-Q2","number":2},{"prompt":"The weather station is _______________ during the winter time, due to the extreme weather conditions.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"inaccessible","id":"S4-E1c-Q3","number":3},{"prompt":"The patient is bleeding _______________, and needs to be operated on immediately.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"internally","id":"S4-E1c-Q4","number":4},{"prompt":"In Indonesia, you can pat the shoulder of a close friend to express approval, but not someone older than you, or of higher _______________.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"status","id":"S4-E1c-Q5","number":5},{"prompt":"Prime Minister Lachance has _______________ with President Harrison, and both agree that immediate action must be taken.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"conferred","id":"S4-E1c-Q6","number":6},{"prompt":"In the Marxist view, we must eat in order to survive; _______________, the first activity of our species must be economic.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"hence","id":"S4-E1c-Q7","number":7},{"prompt":"The sole _______________ of the car that crashed was uninjured in the accident.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"occupant","id":"S4-E1c-Q8","number":8},{"prompt":"The president is quite popular _______________, but is not very well liked abroad.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"domestically","id":"S4-E1c-Q9","number":9},{"prompt":"He turned down the _______________ offered by his boss because he didn't want the added responsibility.","options":["hence","promotion","conferred","phase","status","inaccessible","attributable","internally","domestically","occupant"],"answer":"promotion","id":"S4-E1c-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 2a.html","sublist":4,"exercise":2,"part":"a","questions":[{"prompt":"The students told the teacher that they felt they didn't have _______________ time to finish the test.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"adequate","id":"S4-E2a-Q1","number":1},{"prompt":"The American _______________ War between the North and South cost thousands and thousands of young men their lives.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"civil","id":"S4-E2a-Q2","number":2},{"prompt":"Their _______________ was proven to be true in a number of experiments.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"hypothesis","id":"S4-E2a-Q3","number":3},{"prompt":"It's very difficult to _______________ the weather in Victoria.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"predict","id":"S4-E2a-Q4","number":4},{"prompt":"Our teacher _______________ the importance of learning vocabulary from context, rather than simply memorizing a definition.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"stressed","id":"S4-E2a-Q5","number":5},{"prompt":"Muhammad _______________ as a prophet to his people around 610 A.D.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"emerged","id":"S4-E2a-Q6","number":6},{"prompt":"Firefighters are _______________ a mysterious fire which broke out at a local high school overnight.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"investigating","id":"S4-E2a-Q7","number":7},{"prompt":"Harriet's friendly manner _______________ somewhat with her quick temper.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"contrasts","id":"S4-E2a-Q8","number":8},{"prompt":"You should look at all your different _______________ before you make a decision.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"options","id":"S4-E2a-Q9","number":9},{"prompt":"Millions of people in the Soviet Union died or disappeared during the _______________ of Joseph Stalin.","options":["civil","stressed","contrasts","investigating","adequate","regime","options","hypothesis","emerged","predict"],"answer":"regime","id":"S4-E2a-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 2b.html","sublist":4,"exercise":2,"part":"b","questions":[{"prompt":"The scientific method is the main tool used by psychologists for _______________ both the mind and behaviour.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"investigating","id":"S4-E2b-Q1","number":1},{"prompt":"Martin Luther King, Jr. devoted his life to fighting for the _______________ rights of black Americans.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"civil","id":"S4-E2b-Q2","number":2},{"prompt":"In December 1978, a large Vietnamese army swept into Cambodia, and overthrew the _______________ of Pol Pot.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"regime","id":"S4-E2b-Q3","number":3},{"prompt":"You have a number of payment _______________, including credit cards, Interac, personal cheques or cash in all major currencies.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"options","id":"S4-E2b-Q4","number":4},{"prompt":"My mom is under a lot of _______________ at work right now, so she gets angry for no reason.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"stress","id":"S4-E2b-Q5","number":5},{"prompt":"The politician's statements before the election _______________ greatly with his actions once he was in power.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"contrasted","id":"S4-E2b-Q6","number":6},{"prompt":"Athens _______________ as the political and cultural centre of Greece following the defeat of the Persians around 480 B.C.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"emerged","id":"S4-E2b-Q7","number":7},{"prompt":"Because of the traffic jam, it's hard to _______________ how long it will take to get to the airport.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"predict","id":"S4-E2b-Q8","number":8},{"prompt":"About a quarter of the population of India is too poor to be able to afford an _______________ diet.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"adequate","id":"S4-E2b-Q9","number":9},{"prompt":"A number of different _______________ have been put forward to explain the rise in global temperatures.","options":["stress","emerged","hypotheses","adequate","contrasted","investigating","options","predict","civil","regime"],"answer":"hypotheses","id":"S4-E2b-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 2c.html","sublist":4,"exercise":2,"part":"c","questions":[{"prompt":"In my linguistics class, we did a _______________ analysis of the vowel sounds of Japanese and Spanish.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"contrastive","id":"S4-E2c-Q1","number":1},{"prompt":"A Chinese proverb tells us that respect for one's parents is the highest duty of _______________ life.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"civil","id":"S4-E2c-Q2","number":2},{"prompt":"Huang and van Naerssen have found that reading outside class is the most significant _______________ of speaking ability in a second language.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"predictor","id":"S4-E2c-Q3","number":3},{"prompt":"Galileo _______________ that the world is round.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"hypothesized","id":"S4-E2c-Q4","number":4},{"prompt":"The _______________ of the digital camera has completely changed the nature of popular photography.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"emergence","id":"S4-E2c-Q5","number":5},{"prompt":"She wasn't _______________ prepared for the test, and got a terrible mark as a result.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"adequately","id":"S4-E2c-Q6","number":6},{"prompt":"A firefighter's job is very _______________ because he never knows when he is going to be needed, and when he is needed, the work is usually very dangerous.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"stressful","id":"S4-E2c-Q7","number":7},{"prompt":"The final section in the homework is _______________; I will mark it, but it doesn't count for anything.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"optional","id":"S4-E2c-Q8","number":8},{"prompt":"He follows a fitness _______________ which has him running at least 5 kilometres a day.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"regime","id":"S4-E2c-Q9","number":9},{"prompt":"The _______________ into the robbery led to the arrest of two local teenagers.","options":["civil","contrastive","emergence","stressful","predictor","optional","regime","hypothesized","investigation","adequately"],"answer":"investigation","id":"S4-E2c-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 3a.html","sublist":4,"exercise":3,"part":"a","questions":[{"prompt":"The children wrote each other short messages in a secret _______________ they had made.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"code","id":"S4-E3a-Q1","number":1},{"prompt":"You should check your homework before handing it in so that you can find your own _______________.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"errors","id":"S4-E3a-Q2","number":2},{"prompt":"In order to _______________ this conflict, we need to sit down face to face, and examine the issues together.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"resolve","id":"S4-E3a-Q3","number":3},{"prompt":"We have decided to _______________ the committee's suggestions in full.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"implement","id":"S4-E3a-Q4","number":4},{"prompt":"The addition of three new machines has increased our _______________ by over 50%.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"output","id":"S4-E3a-Q5","number":5},{"prompt":"This year, the _______________ convention is being held in Mazatlan, but next year it will be in Cancun.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"annual","id":"S4-E3a-Q6","number":6},{"prompt":"Death is simply a part of the _______________ of life.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"cycle","id":"S4-E3a-Q7","number":7},{"prompt":"Sophie did quite poorly on her first two math tests, but on _______________ exams she averaged between 90 and 100%.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"subsequent","id":"S4-E3a-Q8","number":8},{"prompt":"He has applied for a _______________ at a department store.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"job","id":"S4-E3a-Q9","number":9},{"prompt":"The _______________ crop grown in Colombia is coffee.","options":["output","cycle","resolve","subsequent","principal","job","code","annual","errors","implement"],"answer":"principal","id":"S4-E3a-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 3b.html","sublist":4,"exercise":3,"part":"b","questions":[{"prompt":"Writing _______________ for a software program is an endless, boring task.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"code","id":"S4-E3b-Q1","number":1},{"prompt":"While rock-climbing, you need to remain very focused so that you don't make any dangerous _______________.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"errors","id":"S4-E3b-Q2","number":2},{"prompt":"If the sun's energy _______________ were decreased by 10%, the entire Earth would be covered in ice over a kilometre thick.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"output","id":"S4-E3b-Q3","number":3},{"prompt":"The _______________ reason why she quit her job was because she didn't feel she had any future there.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"principal","id":"S4-E3b-Q4","number":4},{"prompt":"They have _______________ a new procedure to make registration at the university easier and quicker.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"implemented","id":"S4-E3b-Q5","number":5},{"prompt":"The area which includes the Amazon River has the highest _______________ rainfall in the world.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"annual","id":"S4-E3b-Q6","number":6},{"prompt":"In today's _______________ market, being able to speak another language is a useful skill.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"job","id":"S4-E3b-Q7","number":7},{"prompt":"Ecuador and Peru's border war, which began in 1995, was _______________ in 1999.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"resolved","id":"S4-E3b-Q8","number":8},{"prompt":"The supervisor has announced that our first staff meeting will last for two hours, and _______________ meetings for only one hour.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"subsequent","id":"S4-E3b-Q9","number":9},{"prompt":"Many festivals in Madagascar are connected with the natural _______________ of the year, such as the harvest.","options":["output","resolved","subsequent","code","job","annual","principal","implemented","cycle","errors"],"answer":"cycle","id":"S4-E3b-Q10","number":10}]},{"name":"AWL Sublist 4 - Exercise 3c.html","sublist":4,"exercise":3,"part":"c","questions":[{"prompt":"The information _______________ on DNA must be preserved for the survival of an organism.","options":["implementation","subsequently","annually","output","cycles","job","coded","principally","unresolved","erroneously"],"answer":"coded","id":"S4-E3c-Q1","number":1},{"prompt":"Harvey is overweight _______________ because he doesn't ever do any exercise.","options":["implementation","subsequently","annually","output","cycles","job","coded","principally","unresolved","erroneously"],"answer":"principally","id":"S4-E3c-Q2","number":2},{"prompt":"The remark was _______________ attribu ,"minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"complements","id":"S8-E1a-Q3","number":3},{"prompt":"English is the _______________ language in two of the six inhabited continents.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"predominant","id":"S8-E1a-Q4","number":4},{"prompt":"Careful planning can help to _______________ the damage which may occur during an earthquake.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"minimize","id":"S8-E1a-Q5","number":5},{"prompt":"The Royal British Columbia Museum features beautiful _______________ of native Indian artwork.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"exhibits","id":"S8-E1a-Q6","number":6},{"prompt":"The house has looked _______________ since the Bates family moved away 2 years ago.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"abandoned","id":"S8-E1a-Q7","number":7},{"prompt":"We cannot always anticipate the ways in which natural systems will adjust to changes _______________ by the activities of modern society.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"induced","id":"S8-E1a-Q8","number":8},{"prompt":"A longer nail on the baby finger of a Chinese man often _______________ a background of wealth and privilege.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"denotes","id":"S8-E1a-Q9","number":9},{"prompt":"We are _______________ the report to include additional information received in the last couple of weeks.","options":["uniform","predominant","revising","minimize","complements","arbitrarily","induced","abandoned","exhibits","denotes"],"answer":"revising","id":"S8-E1a-Q10","number":10}]},{"name":"AWL Sublist 8 - Exercise 1b.html","sublist":8,"exercise":1,"part":"b","questions":[{"prompt":"If you don't explain your marking system to the students, it might be interpreted as being _______________ and unfair.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"arbitrary","id":"S8-E1b-Q1","number":1},{"prompt":"The diamonds beside each word in your dictionary _______________ the frequency of usage of that word.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"denote","id":"S8-E1b-Q2","number":2},{"prompt":"If frightened or threatened, a mother rabbit may _______________, ignore, or eat her babies.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"abandon","id":"S8-E1b-Q3","number":3},{"prompt":"The Alberta government is offering substantial tax breaks to _______________ businesses into coming to the province.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"induce","id":"S8-E1b-Q4","number":4},{"prompt":"Her creative talents are an excellent _______________ to his good business sense.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"complement","id":"S8-E1b-Q5","number":5},{"prompt":"Eating properly and getting plenty of exercise will help you to _______________ the risk of a heart attack.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"minimize","id":"S8-E1b-Q6","number":6},{"prompt":"In many countries, men and women rarely _______________ signs of affection in public.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"exhibit","id":"S8-E1b-Q7","number":7},{"prompt":"The _______________ image of African music is that of drumming and percussion.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"predominant","id":"S8-E1b-Q8","number":8},{"prompt":"The editor sent the book back to the author to be _______________ somewhat.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"revised","id":"S8-E1b-Q9","number":9},{"prompt":"The chocolates are selected carefully to be of _______________ size and shape.","options":["predominant","minimize","revised","abandon","complement","denote","exhibit","uniform","induce","arbitrary"],"answer":"uniform","id":"S8-E1b-Q10","number":10}]},{"name":"AWL Sublist 8 - Exercise 1c.html","sublist":8,"exercise":1,"part":"c","questions":[{"prompt":"The meanings of cultural symbols are _______________ determined by the people who create them.","options":["complementary","abandoning","revisions","denotation","predominantly","inducing","exhibit","arbitrarily","uniformly","minimize"],"answer":"arbitrarily","id":"S8-E1c-Q1","number":1},{"prompt":"_______________ opposition, represented by the yin-yang concept, was long a basic feature of Chinese popular culture.","options":["complementary","abandoning","revisions","denotation","predominantly","inducing","exhibit","arbitrarily","uniformly","minimize"],"answer":"complementary","id":"S8-E1c-Q2","number":2},{"prompt":"The young woman was arrested for _______________ her baby, after the infant was found alone at a bus station.","options":["complementary","abandoning","revisions","denotation","predominantly","inducing","exhibit","arbitrarily","uniformly","minimize"]
